version: 2

updates:
  # Dependências npm (pnpm). O GitHub usa o ecossistema "npm" para pnpm.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Minor e patch de producao: baixo risco, um PR so.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Minor e patch de desenvolvimento, separados para nao misturar risco.
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Security updates patch/minor agrupados. Majors nunca entram em grupo.
      security-patch-minor:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions. Inativo enquanto nao existirem workflows, mas ja configurado.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
