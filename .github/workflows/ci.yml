name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm exec tsc --noEmit

      - name: Testes unitarios
        run: pnpm test:run

      - name: Build de producao
        run: pnpm build

  deploy:
    name: Deploy (Vercel)
    needs: quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_ErCtxu5MLPTnHmXxQXTHoRu3
      VERCEL_PROJECT_ID: prj_RXaJR1K8S5BvlA9SGdD3dMobWjwN
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # main publica em producao; beta publica em preview
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VERCEL_PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
      VERCEL_PULL_FLAGS: ${{ github.ref == 'refs/heads/beta' && '--git-branch=beta' || '' }}
      VERCEL_DEPLOY_FLAGS: ${{ github.ref == 'refs/heads/beta' && '--meta githubDeployment=1 --meta githubCommitRef=beta' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Conferir o secret VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::Secret VERCEL_TOKEN ausente. Crie o token em https://vercel.com/account/tokens e salve em Settings > Secrets and variables > Actions."
          exit 1

      - name: Mostrar o alvo do deploy
        run: echo "branch=${{ github.ref_name }} ambiente=$VERCEL_ENVIRONMENT flags=[$VERCEL_PROD_FLAG $VERCEL_DEPLOY_FLAGS]"

      - name: Instalar a Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar as variaveis do projeto
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" $VERCEL_PULL_FLAGS --token="$VERCEL_TOKEN"

      - name: Build com as variaveis do ambiente
        run: vercel build $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Publicar
        run: vercel deploy --prebuilt $VERCEL_PROD_FLAG $VERCEL_DEPLOY_FLAGS --token="$VERCEL_TOKEN"
